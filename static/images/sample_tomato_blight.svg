<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTomato" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="tomatoLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <rect width="300" height="200" rx="16" fill="url(#bgTomato)"/>
  <!-- Tomato Compound Serrated Leaf -->
  <path d="M 80 160 C 50 130, 40 100, 60 70 C 90 75, 110 50, 150 30 C 190 50, 210 75, 240 70 C 260 100, 250 130, 220 160 C 170 170, 130 170, 80 160 Z" fill="url(#tomatoLeafGrad)" stroke="#166534" stroke-width="2"/>
  <path d="M 150 165 L 150 30" stroke="#14532d" stroke-width="2.5" fill="none"/>
  <!-- Bulls-eye concentric spots -->
  <!-- Spot 1 -->
  <circle cx="110" cy="90" r="18" fill="#facc15" opacity="0.6"/>
  <circle cx="110" cy="90" r="13" fill="#78350f"/>
  <circle cx="110" cy="90" r="9" fill="#92400e"/>
  <circle cx="110" cy="90" r="5" fill="#451a03"/>
  <circle cx="110" cy="90" r="2" fill="#1c1917"/>

  <!-- Spot 2 -->
  <circle cx="190" cy="115" r="15" fill="#facc15" opacity="0.6"/>
  <circle cx="190" cy="115" r="10" fill="#78350f"/>
  <circle cx="190" cy="115" r="6" fill="#92400e"/>
  <circle cx="190" cy="115" r="3" fill="#451a03"/>

  <!-- Spot 3 -->
  <circle cx="150" cy="65" r="10" fill="#facc15" opacity="0.6"/>
  <circle cx="150" cy="65" r="7" fill="#78350f"/>
  <circle cx="150" cy="65" r="3" fill="#451a03"/>

  <!-- Label -->
  <rect x="20" y="165" width="260" height="24" rx="6" fill="#1b4332" opacity="0.9"/>
  <text x="150" y="181" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Sample: Tomato Early Blight (Alternaria)</text>
</svg>
