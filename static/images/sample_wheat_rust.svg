<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="wheatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="70%" stop-color="#65a30d"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </linearGradient>
  </defs>
  <rect width="300" height="200" rx="16" fill="url(#bgGrad)"/>
  <!-- Wheat Long Slender Blade -->
  <path d="M 60 170 Q 140 120 150 25 Q 160 120 240 170 C 180 175, 120 175, 60 170 Z" fill="url(#wheatGrad)" stroke="#3f6212" stroke-width="2"/>
  <path d="M 150 170 L 150 25" stroke="#365314" stroke-width="2.5" fill="none"/>
  <!-- Rust Stripes / Pustules -->
  <g fill="#ea580c" stroke="#c2410c" stroke-width="0.5">
    <ellipse cx="143" cy="60" rx="2" ry="7"/>
    <ellipse cx="143" cy="78" rx="2" ry="6"/>
    <ellipse cx="143" cy="95" rx="2" ry="8"/>
    <ellipse cx="143" cy="115" rx="2" ry="7"/>
    <ellipse cx="157" cy="50" rx="2" ry="6"/>
    <ellipse cx="157" cy="68" rx="2" ry="8"/>
    <ellipse cx="157" cy="88" rx="2" ry="7"/>
    <ellipse cx="157" cy="108" rx="2" ry="9"/>
    <ellipse cx="157" cy="130" rx="2" ry="6"/>
    <ellipse cx="136" cy="85" rx="1.8" ry="6"/>
    <ellipse cx="136" cy="105" rx="1.8" ry="7"/>
    <ellipse cx="164" cy="95" rx="1.8" ry="6"/>
    <ellipse cx="164" cy="118" rx="1.8" ry="8"/>
  </g>
  <!-- Label -->
  <rect x="20" y="165" width="260" height="24" rx="6" fill="#1b4332" opacity="0.9"/>
  <text x="150" y="181" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Sample: Wheat Stripe / Yellow Rust</text>
</svg>
