<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHealthy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="lushGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="80%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <rect width="300" height="200" rx="16" fill="url(#bgHealthy)"/>
  <!-- Vibrant Healthy Lush Leaf -->
  <path d="M 60 165 C 50 120, 100 70, 150 25 C 200 70, 250 120, 240 165 C 190 175, 110 175, 60 165 Z" fill="url(#lushGreen)" stroke="#14532d" stroke-width="2.5"/>
  <!-- Central Vein -->
  <path d="M 150 170 Q 152 100 150 25" stroke="#86efac" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Secondary Symmetrical Veins -->
  <path d="M 151 135 Q 110 125 78 145" stroke="#86efac" stroke-width="2" fill="none"/>
  <path d="M 151 135 Q 190 125 222 145" stroke="#86efac" stroke-width="2" fill="none"/>
  <path d="M 151 100 Q 115 90 90 108" stroke="#86efac" stroke-width="1.8" fill="none"/>
  <path d="M 151 100 Q 185 90 210 108" stroke="#86efac" stroke-width="1.8" fill="none"/>
  <path d="M 150 65 Q 125 60 110 75" stroke="#86efac" stroke-width="1.5" fill="none"/>
  <path d="M 150 65 Q 175 60 190 75" stroke="#86efac" stroke-width="1.5" fill="none"/>

  <!-- Sun Gleam -->
  <ellipse cx="130" cy="55" rx="14" ry="6" fill="#ffffff" opacity="0.35" transform="rotate(-30 130 55)"/>

  <!-- Label -->
  <rect x="20" y="165" width="260" height="24" rx="6" fill="#1b4332" opacity="0.9"/>
  <text x="150" y="181" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✓ Sample: 100% Healthy Crop Foliage</text>
</svg>
