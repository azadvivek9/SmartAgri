<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="lesionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
  </defs>
  <rect width="300" height="200" rx="16" fill="url(#bgGrad)"/>
  <!-- Leaf Blade -->
  <path d="M 50 160 C 90 140, 130 90, 160 40 C 190 90, 230 140, 250 160 C 190 170, 110 170, 50 160 Z" fill="url(#leafGrad)" stroke="#166534" stroke-width="2"/>
  <!-- Leaf Central Vein -->
  <path d="M 150 165 Q 155 100 160 40" stroke="#14532d" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Side Veins -->
  <path d="M 153 130 Q 120 120 90 135" stroke="#166534" stroke-width="1.5" fill="none"/>
  <path d="M 155 130 Q 190 120 220 135" stroke="#166534" stroke-width="1.5" fill="none"/>
  <path d="M 157 90 Q 130 80 110 95" stroke="#166534" stroke-width="1.5" fill="none"/>
  <path d="M 158 90 Q 185 80 205 95" stroke="#166534" stroke-width="1.5" fill="none"/>
  <!-- Bacterial Blight Lesions & Streaks -->
  <path d="M 160 40 Q 175 60 170 85 Q 162 105 158 90 Q 154 60 160 40 Z" fill="url(#lesionGrad)" opacity="0.95"/>
  <path d="M 230 140 Q 240 120 220 110 Q 200 125 210 145 Z" fill="url(#lesionGrad)" opacity="0.9"/>
  <path d="M 75 145 Q 85 130 70 120 Q 60 135 75 145 Z" fill="url(#lesionGrad)" opacity="0.85"/>
  <circle cx="165" cy="70" r="4" fill="#713f12"/>
  <circle cx="215" cy="128" r="3" fill="#713f12"/>
  <!-- Text Label -->
  <rect x="20" y="165" width="260" height="24" rx="6" fill="#1b4332" opacity="0.9"/>
  <text x="150" y="181" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Sample: Rice Bacterial Leaf Blight</text>
</svg>
